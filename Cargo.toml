[package]
name = "art3m1s-core"
version = "0.4.0"
license = "MPL-2.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "compatibility_probe"
path = "tools/game-probes/src/bin/compatibility_probe.rs"
required-features = ["game-probes"]

[[bin]]
name = "probe_caption_test"
path = "tools/game-probes/src/bin/probe_caption_test.rs"
required-features = ["game-probes"]

[dependencies]
asb-interpreter = { path = "crates/asb-interpreter", default-features = false }
art3m1s-emote = { path = "crates/art3m1s-emote", default-features = false }
art3m1s-log = { path = "crates/art3m1s-log" }
art3m1s-render = { path = "crates/art3m1s-render", features = ["artemis-frame", "emote"] }
pfs-upk-rust = { path = "crates/pfs-upk-rust", optional = true }
art3m1s-media = { path = "crates/art3m1s-media", optional = true }
art3m1s-native-render = { path = "crates/art3m1s-native-render", optional = true }
art3m1s-rfvp = { path = "crates/art3m1s-rfvp", optional = true, features = ["host-runtime"] }
art3m1s-krkr = { path = "crates/art3m1s-krkr", optional = true }
art3m1s-siglus = { path = "crates/art3m1s-siglus", optional = true }
pal-vm = { git = "https://github.com/Alphaly2K/sena-rs.git", rev = "c0cab5af53b71e91bb6ef258f46b03956740caf2", optional = true, default-features = false, features = ["host-audio", "embedded"] }
pal-asset = { git = "https://github.com/Alphaly2K/sena-rs.git", rev = "c0cab5af53b71e91bb6ef258f46b03956740caf2", optional = true }
cpal = { version = "0.15.3", optional = true }
encoding_rs = "0.8"
flate2 = { version = "1", optional = true }
glam = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# GPU texture asset decoding (PNG only).
image = { version = "0.25", default-features = false, features = ["png"] }
# 字体光栅化（字形渲染子系统）
ab_glyph = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6.4", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = { version = "0.1.1", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
ctt-astcenc = { version = "0.5", optional = true }

[features]
default = ["gl-backend"]
host-abi-v2 = []
katze-model-host = ["dep:flate2", "dep:objc2"]
legacy = [
    "dep:art3m1s-native-render",
    "dep:pfs-upk-rust",
    "dep:art3m1s-media",
    "dep:ctt-astcenc",
    "art3m1s-emote/filesystem",
    "asb-interpreter/console-diagnostics",
    "asb-interpreter/filesystem-fallback",
    "asb-interpreter/system-clock",
]
gl-backend = ["legacy", "art3m1s-render/gl"]
metal-backend = ["legacy", "runtime-shader", "art3m1s-render/metal"]
vulkan-backend = ["legacy", "runtime-shader", "art3m1s-render/vulkan"]
runtime-shader = ["art3m1s-render/runtime-shader"]
rfvp-engine = ["legacy", "rfvp-host-v2"]
rfvp-host-v2 = ["dep:art3m1s-rfvp"]
krkr-engine = ["legacy", "dep:art3m1s-krkr", "art3m1s-krkr/native-upstream"]
siglus-engine = ["legacy", "dep:art3m1s-siglus", "art3m1s-siglus/host-audio", "dep:cpal", "dep:ndk-context"]
sena-engine = ["dep:pal-vm", "dep:pal-asset", "dep:cpal", "dep:ndk-context"]
ffmpeg = ["legacy", "art3m1s-media/ffmpeg", "art3m1s-siglus?/uci-ffmpeg"]
game-probes = ["gl-backend"]

[dev-dependencies]
art3m1s-render = { path = "crates/art3m1s-render", features = ["artemis"] }
# 离屏像素回读测试需要在 macOS 上创建一个 CGL headless 上下文。
glow = "0.16"
