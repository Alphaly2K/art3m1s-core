[package]
name = "art3m1s-core"
version = "0.4.0"
license = "MPL-2.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "compatibility_probe"
path = "tools/game-probes/src/bin/compatibility_probe.rs"
required-features = ["game-probes"]

[[bin]]
name = "probe_caption_test"
path = "tools/game-probes/src/bin/probe_caption_test.rs"
required-features = ["game-probes"]

[[bin]]
name = "emote_parity_probe"
path = "tools/game-probes/src/bin/emote_parity_probe.rs"
required-features = ["game-probes", "experimental-eluna"]

[dependencies]
art3m1s-emote = { path = "crates/art3m1s-emote" }
art3m1s-log = { path = "crates/art3m1s-log" }
art3m1s-render = { path = "crates/art3m1s-render" }
eluna = { package = "eluna_rs", path = "crates/eluna", optional = true }
pfs-upk-rust = { path = "crates/pfs-upk-rust" }
art3m1s-media = { path = "crates/art3m1s-media" }
art3m1s-rfvp = { path = "crates/art3m1s-rfvp", optional = true, features = ["host-runtime"] }
encoding_rs = "0.8"
glam = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# GPU texture asset decoding (PNG only).
image = { version = "0.25", default-features = false, features = ["png"] }
# 字体光栅化（字形渲染子系统）
ab_glyph = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
asb-interpreter = { path = "crates/asb-interpreter", default-features = false, features = ["backend-luau"] }

[target.'cfg(any(target_os = "android", target_os = "ios", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
ctt-astcenc = "0.5"

[target.'cfg(not(target_os = "ios"))'.dependencies]
asb-interpreter = { path = "crates/asb-interpreter", default-features = false, features = ["backend-lua51"] }

[features]
default = ["gl-backend", "metal-backend", "vulkan-backend", "experimental-eluna", "rfvp-engine"]
gl-backend = ["art3m1s-render/gl"]
metal-backend = ["runtime-shader", "art3m1s-render/metal"]
vulkan-backend = ["runtime-shader", "art3m1s-render/vulkan"]
runtime-shader = ["art3m1s-render/runtime-shader"]
experimental-eluna = ["dep:eluna"]
rfvp-engine = ["dep:art3m1s-rfvp"]
ffmpeg = ["art3m1s-media/ffmpeg"]
game-probes = ["gl-backend"]

[dev-dependencies]
# 离屏像素回读测试需要在 macOS 上创建一个 CGL headless 上下文。
glow = "0.16"
