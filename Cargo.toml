[package]
name = "art3m1s-core"
version = "0.4.0"
license = "MPL-2.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "compatibility_probe"
path = "tools/game-probes/src/bin/compatibility_probe.rs"
required-features = ["game-probes"]

[[bin]]
name = "probe_caption_test"
path = "tools/game-probes/src/bin/probe_caption_test.rs"
required-features = ["game-probes"]

[[bin]]
name = "emote_parity_probe"
path = "tools/game-probes/src/bin/emote_parity_probe.rs"
required-features = ["game-probes", "experimental-eluna"]

[dependencies]
art3m1s-emote = { path = "crates/art3m1s-emote" }
eluna = { package = "eluna_rs", path = "crates/eluna", optional = true }
pfs-upk-rust = { path = "crates/pfs-upk-rust" }
encoding_rs = "0.8"
glam = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# GL reference backend. Native Apple builds select Metal by default, but keep
# this feature available for explicit A/B comparison.
glow = { version = "0.16", optional = true }
libloading = { version = "0.8.9", optional = true }
# GPU texture asset decoding (PNG only).
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# 字体光栅化（字形渲染子系统）
ab_glyph = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
asb-interpreter = { path = "crates/asb-interpreter", default-features = false, features = ["backend-luau"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["NSString"] }
objc2-io-surface = { version = "0.3.2", optional = true, default-features = false, features = ["IOSurfaceRef", "objc2"] }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLArgument",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "objc2-io-surface",
] }
objc2-quartz-core = { version = "0.3.2", optional = true, default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }

[target.'cfg(any(target_os = "android", target_os = "ios", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
ctt-astcenc = "0.5"

[target.'cfg(not(target_os = "ios"))'.dependencies]
asb-interpreter = { path = "crates/asb-interpreter", default-features = false, features = ["backend-lua51"] }

[features]
default = ["gl-backend", "metal-backend", "experimental-eluna"]
gl-backend = ["dep:glow", "dep:image", "dep:libloading"]
metal-backend = [
    "dep:image",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-io-surface",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
]
experimental-eluna = ["dep:eluna"]
game-probes = ["gl-backend"]

[dev-dependencies]
# 离屏像素回读测试需要在 macOS 上创建一个 CGL headless 上下文。
# 测试里用来在内存中编码一张 PNG 喂给解码路径。
image = { version = "0.25", default-features = false, features = ["png"] }
