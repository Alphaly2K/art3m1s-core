[package]
name = "pf8"
version = "0.1.6"
edition = "2024"
description = "A Rust library for encoding and decoding artemis PF8 archive files"
keywords = ["pfs", "pf8", "archive", "galgame"]
repository = "https://github.com/sakarie9/pfs-rs"
license = "MIT"
readme = "README.md"

[dependencies]
thiserror = "2"
sha1 = "0.11"
walkdir = "2"
encoding_rs = "0.8"

# Optional dependencies for extra features
human_bytes = { version = "0.4", default-features = false, optional = true }
tabled = { version = "0.20", default-features = false, features = ["derive"], optional = true }

[features]
default = []
display = ["human_bytes", "tabled"]

[dev-dependencies]
tempfile = "3"
