[package]
name = "asb-interpreter"
version = "0.2.0"
license = "MPL-2.0"
edition = "2024"

[features]
default = ["console-diagnostics"]
console-diagnostics = []

[dependencies]
# Luau builds its bundled source automatically. `vendored` would additionally
# pull in the unused standard Lua and LuaJIT source packages.
mlua = { version = "0.10", default-features = false, features = ["luau", "send", "serialize"] }
asb-decrypt = { git = "https://github.com/Alphaly2K/asb-decrypt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
thiserror = "2.0"
libc = "0.2"
