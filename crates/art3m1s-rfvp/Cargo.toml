[package]
name = "art3m1s-rfvp"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "RFVP draw-command adaptation for the Art3m1s render backend"

[dependencies]
art3m1s-render = { path = "../art3m1s-render" }
anyhow = { version = "1", optional = true }
glam = "0.30"
image = { version = "0.24.9", optional = true, default-features = false, features = ["png"] }
rfvp = { path = "../../../rfvp/crates/rfvp", default-features = false, features = ["external-renderer"], optional = true }

[features]
default = []
rfvp-fork = ["dep:rfvp"]
winit-smoke = [
    "rfvp-fork",
    "rfvp/gpu-render",
    "art3m1s-render/metal",
    "dep:anyhow",
    "dep:image",
]

[[bin]]
name = "rfvp_win95_smoke"
path = "src/bin/rfvp_win95_smoke.rs"
required-features = ["winit-smoke"]
