[package]
name = "artemis-metal-smoke"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
default-run = "artemis-metal-smoke"

[[bin]]
name = "artemis-metal-smoke"
path = "metal.rs"

[[bin]]
name = "artemis-gl-smoke"
path = "gl.rs"
required-features = ["gl-smoke"]

[[bin]]
name = "artemis-dxvk-arfp"
path = "dxvk_arfp.rs"
required-features = ["dxvk-smoke"]

[features]
gl-smoke = ["art3m1s-render/gl"]
dxvk-smoke = []

[target.'cfg(target_os = "macos")'.dependencies]
art3m1s-render = { path = "../../crates/art3m1s-render", features = ["artemis", "metal"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
art3m1s-render = { path = "../../crates/art3m1s-render", features = ["artemis"] }
serde_json = "1.0"

[build-dependencies]
cc = "1"
